services:
  postgres:
    image: postgres:16-alpine
    container_name: lume-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: lume
    ports:
      - "5432:5432"
    volumes:
      - lume_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lume"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  lume_pgdata:
